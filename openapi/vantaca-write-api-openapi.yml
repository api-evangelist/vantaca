      - name: complianceGroup
        in: query
        description: service provider's compliance grouping
        schema:
          type: string
      - name: name
        in: query
        description: service provider name
        schema:
          type: string
      - name: dbaName
        in: query
        description: service provider business name. *this will be the name that appears on checks, otherwise, Vantaca will use the regular provider name*
        schema:
          type: string
      - name: streetNo
        in: query
        description: service provider street number
        schema:
          type: integer
      - name: address1
        in: query
        description: service provider first address line
        schema:
          type: string
      - name: address2
        in: query
        description: service provider second address line
        schema:
          type: string
      - name: city
        in: query
        description: service provider city
        schema:
          type: string
      - name: state
        in: query
        description: service provider state
        schema:
          type: string
      - name: zip
        in: query
        description: service provider zip
        schema:
          type: string
      - name: phone
        in: query
        description: service provider phone number (10 digit)
        schema:
          type: string
      - name: fax
        in: query
        description: service provider fax number
        schema:
          type: string
      - name: contactName
        in: query
        description: primary service provider contact name
        schema:
          type: string
      - name: email
        in: query
        description: service provider email address
        schema:
          type: string
      - name: taxID
        in: query
        description: federal tax identification number </br> *field is only required if *is1099* = **true***
        schema:
          type: integer
      - name: preferredProvider
        in: query
        description: if **true**, preferred provider for the association, else **false**. *Preferred providers will appear in searches first*
        schema:
          type: boolean
      - name: report1099box
        in: query
        description: service provider 1099 box option. *provide numeric box value. for example, 'NEC - Box 1 - Non- Employee Compensation', enter "1"*
        schema:
          type: integer
      - name: complianceExempt
        in: query
        description: if **true** provider is exempt from standard insurance compliance standards, else **false**
        schema:
          type: boolean
      - name: providerTypeID
        in: query
        description: unique identifier for the service provider type. *only allows types available on **Service Providers > Service Types in Vantaca*** </br> </br> ***note:*** *An invalid providerTypeID may be validated if the value matches existing provider data.*
        schema:
          type: integer
      - name: is1099
        in: query
        description: if **true** service provider will be sent a 1099 at year end, else **false** </br> *requires taxID information if is1099 = **true***
        schema:
          type: boolean
      responses:
        '200':
          description: OK Success
        '204':
          description: no content - call was successful, but no data for given parameters
        '400':
          description: bad request - required parameters are missing or invalid
        '403':
          description: forbidden - authentication failed
        '404':
          description: not found
        '500':
          description: internal error - internal processing error, please contact support if issue persists
  /write/providerInsuranceCreate:
    post:
      tags:
      - Write
      summary: creates a provider insurance
      operationId: createProviderInsurance
      parameters:
      - $ref: https://api.swaggerhub.com/domains/Vantaca/standard_domains/1.2.2#/components/parameters/companyParam
      - $ref: https://api.swaggerhub.com/domains/Vantaca/standard_domains/1.2.2#/components/parameters/loginParam
      - $ref: https://api.swaggerhub.com/domains/Vantaca/standard_domains/1.2.2#/components/parameters/pwdParam
      - in: query
        name: providerID
        description: unique identifier for the service provider
        schema:
          type: integer
        required: true
      - in: query
        name: insuranceType
        description: 'the type of insurance policy. possible values: General Liability, Auto Liability, Auto Liability, Worker''s Comp, Umbrella Liability, Professional Liability/Errors & Omissions, Misc/Other.'
        schema:
          type: string
        required: true
      - in: query
        name: accountNo
        description: account number for the insurance policy
        schema:
          type: string
        required: true
      - in: query
        name: expirationDate
        description: insurance policy expiration date
        schema:
          type: string
          format: date-time
      - in: query
        name: isRequired
        description: if **true**, insurance is required for provider, else **false**
        schema:
          type: boolean
      responses:
        '200':
          description: OK Success
        '204':
          description: no content - call was successful, but no data for given parameters
        '400':
          description: bad request - required parameters are missing or invalid
        '403':
          description: forbidden - authentication failed
        '404':
          description: not found
