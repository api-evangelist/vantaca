openapi: 3.2.0
info:
  description: The Vantaca API is a JSON based web service.
  version: 3.8.0
  title: Vantaca's Standard /write/ API
  contact:
    email: vendorsupport@vantaca.com
servers:
- description: SwaggerHub API Auto Mocking
  url: https://virtserver.swaggerhub.com/Vantaca/vantacaStandard/3.8.0
tags:
- name: Write
  description: 'These methods write data. Unless otherwise specified, all object types available are paired with individual /read/ to allow full CRUD (Create, Read, Update, and Destory) operations against any item. Note: Entering invalid dates may result in them appearing as null or blank in Vantaca

    All calls will use the same URL path: /write/{***method***}'
paths:
  /write/emailCreate:
    post:
      tags:
      - Write
      summary: creates a homeowner email
      operationId: createEmail
      parameters:
      - $ref: https://api.swaggerhub.com/domains/Vantaca/standard_domains/1.2.2#/components/parameters/companyParam
      - $ref: https://api.swaggerhub.com/domains/Vantaca/standard_domains/1.2.2#/components/parameters/loginParam
      - $ref: https://api.swaggerhub.com/domains/Vantaca/standard_domains/1.2.2#/components/parameters/pwdParam
      - in: query
        name: hoID
        description: unique identifier for a homeowner
        schema:
          type: integer
        required: true
      - in: query
        name: email
        description: homeowner email. *multiple emails can be stored in a single record separated by "," or ";". Multiple emails are used when more than one primary email is requested*
        schema:
          type: string
          format: email
        required: true
      - in: query
        name: isPrimary
        description: if **true**, email is used as primary communication preference for homeowner, else **false**
        schema:
          type: boolean
      - in: query
        name: label
        description: label for the email address
        schema:
          type: string
      responses:
        '200':
          description: OK Success
        '204':
          description: no content - call was successful, but no data for given parameters
        '400':
          description: bad request - required parameters are missing or parameter values are invalid
        '403':
          description: forbidden - authentication failed
        '404':
          description: not found
        '500':
          description: internal error - internal processing error, please contact support if issue persists
  /write/emailUpdate:
    post:
      tags:
      - Write
      summary: updates an existing homeowner email
      operationId: updateEmail
      parameters:
      - $ref: https://api.swaggerhub.com/domains/Vantaca/standard_domains/1.2.2#/components/parameters/companyParam
      - $ref: https://api.swaggerhub.com/domains/Vantaca/standard_domains/1.2.2#/components/parameters/loginParam
      - $ref: https://api.swaggerhub.com/domains/Vantaca/standard_domains/1.2.2#/components/parameters/pwdParam
      - in: query
        name: emailID
        description: unique identifier for an email address
        schema:
          type: string
        required: true
      - in: query
        name: email
        description: homeowner email. *multiple emails can be stored in a single record separated by "," or ";". Multiple emails are used when more than one primary email is requested*
        schema:
          type: string
          format: email
        required: true
      - in: query
        name: isPrimary
        description: if **true**, email is used as primary communication preference for homeowner, else **false**
        schema:
          type: boolean
      - in: query
        name: label
        description: label for the email address
        schema:
          type: string
      responses:
        '200':
          description: OK Success
        '204':
          description: no content - call was successful, but no data for given parameters
        '400':
          description: bad request - required parameters are missing or invalid
        '403':
          description: forbidden - authentication failed
        '404':
          description: not found
        '500':
          description: internal error - internal processing error, please contact support if issue persists
  /write/emailDestroy:
    post:
      tags:
      - Write
      summary: deletes an existing homeowner email
      operationId: deleteEmail
      parameters:
      - $ref: https://api.swaggerhub.com/domains/Vantaca/standard_domains/1.2.2#/components/parameters/companyParam
      - $ref: https://api.swaggerhub.com/domains/Vantaca/standard_domains/1.2.2#/components/parameters/loginParam
      - $ref: https://api.swaggerhub.com/domains/Vantaca/standard_domains/1.2.2#/components/parameters/pwdParam
