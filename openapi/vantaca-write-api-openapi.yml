        name: nextActionStepID
        description: action step ID the action item is being stepped to
        schema:
          type: integer
        required: true
      - in: query
        name: typeID
        description: approve or deny the action item, *if needed*. </br> null = updates/steps action item without approving or denying </br> 1 = approve </br> 2 = deny
        schema:
          type: string
      - name: cureDate
        in: query
        description: date the violation action item must be resolved by
        schema:
          type: string
          format: date
      - name: hearingDate
        in: query
        description: hearing date of violation action item
        schema:
          type: string
          format: date-time
      - in: query
        name: note
        description: creates a new note on the action item
        schema:
          type: string
      requestBody:
        description: file attachment details </br> *3MB file size limit*
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                file:
                  type: string
                  description: file in base64 format
                  example: bGlnaHQgd29yay4=
                fileName:
                  type: string
                  description: file name
                  example: topsecretstuff.png
                isPrimary:
                  type: boolean
                  description: if **true**, image will be used in the generated letter, else **false** and most recent attachment image will be used.
