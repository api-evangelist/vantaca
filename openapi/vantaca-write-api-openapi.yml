        required: true
      - in: query
        name: label
        description: optional label for the address
        schema:
          type: string
      - in: query
        name: address1
        description: mailing street number and street name
        required: true
        schema:
          type: string
      - in: query
        name: address2
        description: mailing unit
        schema:
          type: string
      - in: query
        name: city
        description: mailing city
        required: true
        schema:
          type: string
      - in: query
