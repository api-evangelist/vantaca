        schema:
          type: string
        required: true
      responses:
        '200':
          description: OK Success
        '204':
          description: no content - call was successful, but no data for given parameters
        '400':
          description: bad request - required parameters are missing or invalid
        '403':
          description: forbidden - authentication failed
        '404':
          description: not found
        '500':
          description: internal error - internal processing error, please contact support if issue persists
  /write/commPrefUpdate:
    post:
      tags:
      - Write
      summary: updates a homeowner communication preference and billing communication…
      operationId: updateCommPreference
      parameters:
      - $ref: https://api.swaggerhub.com/domains/Vantaca/standard_domains/1.2.2#/components/parameters/companyParam
      - $ref: https://api.swaggerhub.com/domains/Vantaca/standard_domains/1.2.2#/components/parameters/loginParam
      - $ref: https://api.swaggerhub.com/domains/Vantaca/standard_domains/1.2.2#/components/parameters/pwdParam
      - in: query
        name: hoID
        description: unique identifier for a homeowner
        schema:
          type: integer
        required: true
      - in: query
        name: commPref
        description: communication preference. *can be excluded only if billingPref is included*
        schema:
          type: string
          enum:
          - Paper
          - Text
          - Email
          - App
      - in: query
        name: billingPref
        description: billing communication preference. *can be excluded only if commPref is included*
        schema:
          type: string
          enum:
          - Paper
          - Text
          - Email
      responses:
        '200':
          description: OK Success
        '204':
          description: no content - call was successful, but no data for given parameters
        '400':
          description: bad request - required parameters are missing or invalid
        '403':
          description: forbidden - authentication failed
        '404':
          description: not found
        '500':
          description: internal error - internal processing error, please contact support if issue persists
  /write/createProvider:
    post:
      tags:
      - Write
      summary: creates a new service provider
      parameters:
      - $ref: https://api.swaggerhub.com/domains/Vantaca/standard_domains/1.2.2#/components/parameters/companyParam
      - $ref: https://api.swaggerhub.com/domains/Vantaca/standard_domains/1.2.2#/components/parameters/loginParam
      - $ref: https://api.swaggerhub.com/domains/Vantaca/standard_domains/1.2.2#/components/parameters/pwdParam
      - name: name
        in: query
        description: service provider name
        required: true
        schema:
          type: string
      - name: dbaName
        in: query
        description: service provider business name. *this will be the name that appears on checks, otherwise, Vantaca will use the regular provider name*
        schema:
          type: string
      - name: streetNo
        in: query
        description: service provider street number
        schema:
          type: integer
      - name: address1
        in: query
        description: service provider first address line
        schema:
          type: string
      - name: address2
        in: query
        description: service provider second address line
        schema:
          type: string
      - name: city
        in: query
        description: service provider city
        schema:
          type: string
      - name: state
        in: query
        description: service provider state
        schema:
          type: string
      - name: zip
        in: query
        description: service provider zip
        schema:
          type: string
      - name: phone
        in: query
        description: service provider phone number (10 digit)
        schema:
          type: string
      - name: fax
        in: query
        description: service provider fax number
        schema:
          type: string
      - name: contactName
        in: query
        description: primary service provider contact name
        schema:
          type: string
      - name: email
        in: query
        description: service provider email address
        schema:
          type: string
      - name: taxID
        in: query
        description: federal tax identification number </br> **field is only required if *is1099* = true**
        schema:
          type: integer
      - name: preferredProvider
        in: query
        description: if **true**, preferred provider for the association, else **false**. *Preferred providers will appear in searches first*
        schema:
          type: boolean
      - name: report1099box
        in: query
        description: service provider 1099 box option. *provide numeric box value. for example, 'NEC - Box 1 - Non- Employee Compensation', enter "1"*
        schema:
          type: integer
      - name: onHold
        in: query
        description: if **true**, provider is on hold, else, **false**
        schema:
          type: boolean
      - name: onHoldReason
        in: query
        description: reason the provider is on hold
        schema:
          type: string
      - name: compliant
        in: query
        description: if **true**, provider is compliant, else **false**
        schema:
          type: boolean
      - name: complianceStatus
        in: query
        description: provider's compliance status
        schema:
          type: string
      - name: complianceGroup
        in: query
        description: service provider's compliance grouping
        schema:
          type: string
      - name: complianceExempt
        in: query
        description: if **true** provider is exempt from standard insurance compliance standards, else **false**
        schema:
          type: boolean
      - name: providerTypeID
        in: query
        description: unique identifier for the service provider type. *only allows types available on **Service Providers > Service Types in Vantaca***
        schema:
          type: integer
      - name: is1099
        in: query
        description: if **true** service provider will be sent a 1099 at year end, else **false**
        schema:
          type: boolean
      responses:
        '200':
          description: OK Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/createProvider'
        '204':
          description: no content - call was successful, but no data for given parameters
        '403':
          description: forbidden - authentication failed
        '404':
          description: not found
        '500':
          description: internal error - internal processing error, please contact support if issue persists
      operationId: postWriteCreateProvider
      x-operation-id-source: derived
  /write/providerUpdate:
