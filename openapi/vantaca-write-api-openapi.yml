  /write/addressCreate:
    post:
      tags:
      - Write
      summary: creates a homeowner address
      operationId: createAddress
      parameters:
      - $ref: https://api.swaggerhub.com/domains/Vantaca/standard_domains/1.2.2#/components/parameters/companyParam
      - $ref: https://api.swaggerhub.com/domains/Vantaca/standard_domains/1.2.2#/components/parameters/loginParam
      - $ref: https://api.swaggerhub.com/domains/Vantaca/standard_domains/1.2.2#/components/parameters/pwdParam
      - in: query
        name: hoID
        description: unique identifier for a homeowner
        schema:
          type: integer
        required: true
      - in: query
        name: label
        description: optional label for the address
        schema:
          type: string
      - in: query
        name: address1
        description: mailing street number and street name
        required: true
        schema:
          type: string
      - in: query
        name: address2
        description: mailing unit
        schema:
          type: string
      - in: query
        name: city
        description: mailing city
        required: true
        schema:
          type: string
      - in: query
        name: state
        description: mailing state (2 character abbreviation)
        required: true
        schema:
          type: string
      - in: query
        name: zip
        description: mailing zip
        required: true
        schema:
          type: string
      - in: query
        name: isPrimary
        description: if **true**, mailing address will be used as primary communication preference for homeowner, else **false**
        schema:
          type: boolean
      - in: query
        name: isInternational
        description: if **true**, address is international, else **false** and address is domestic
        schema:
          type: boolean
      - in: query
        name: country
        description: country
        schema:
          type: string
      - in: query
        name: isMailing
        description: if **true**, address will be used as mailing address, else **false**
        schema:
          type: boolean
      responses:
        '200':
          description: OK Success
        '204':
          description: no content - call was successful, but no data for given parameters
        '400':
          description: bad request - required parameters are missing or parameter values are invalid
        '403':
          description: forbidden - authentication failed
        '404':
          description: not found
        '500':
          description: internal error - internal processing error, please contact support if issue persists
  /write/addressUpdate:
    post:
      tags:
      - Write
      summary: updates an existing homeowner address
