  /write/CreateActionItemNote:
    post:
      tags:
      - Write
      summary: creates a note on an existing action item
      operationId: createActionItemNote
      parameters:
      - $ref: https://api.swaggerhub.com/domains/Vantaca/standard_domains/1.2.2#/components/parameters/companyParam
      - $ref: https://api.swaggerhub.com/domains/Vantaca/standard_domains/1.2.2#/components/parameters/loginParam
      - $ref: https://api.swaggerhub.com/domains/Vantaca/standard_domains/1.2.2#/components/parameters/pwdParam
      requestBody:
        description: action item note details. *3MB file size limit per attachment*
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                XN:
                  type: integer
                  description: unique identifier for the action item to be updated
                  example: 231252
                note:
                  type: string
                  description: note text to be added to the action item. *required if no attachments are provided*
                  example: Homeowner called to confirm receipt of letter.
                assocCode:
                  type: string
                  description: unique identifier for an association
                  example: '100'
                accountNo:
                  type: string
                  description: unique identifier for a single homeowner account
                  example: '100253647'
                attachments:
                  type: array
                  description: list of file attachments. *required if no note is provided*
                  items:
                    type: object
                    properties:
                      fileName:
                        type: string
                        description: name of the file with extension. *required if attachments array is provided*
                        example: inspection_photo.png
                      file:
                        type: string
                        description: base64 encoded file. *required if attachments array is provided*
                        example: bGlnaHQgd29yay4=
              required:
              - XN
      responses:
        '200':
          description: OK Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responseSuccess'
        '400':
          description: bad request - required parameters are missing, request body is malformed, or assocCode is invalid
        '403':
          description: forbidden - authentication failed
        '404':
          description: not found
        '500':
          description: internal error - internal processing error, please contact support if issue persists
components:
  schemas:
    createViolation:
      type: object
      properties:
        actionItemID:
          type: integer
          description: action item number (XN Number)
          example: 231252
    createProvider:
      type: object
      properties:
        providerID:
          type: integer
          description: unique identifier for service provider
          example: 1337
    responseSuccess:
      type: object
      properties:
        status:
          type: string
          description: unique identifier for payment
          example: success
x-internal: false
