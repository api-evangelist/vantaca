  /AP/listAssocInvoices:
    get:
      tags:
      - ap
      summary: returns a list of an association's invoices for a specific period
      operationId: listAssocInvoices
      parameters:
      - $ref: https://api.swaggerhub.com/domains/Vantaca/standard_domains/1.2.2#/components/parameters/companyParam
      - $ref: https://api.swaggerhub.com/domains/Vantaca/standard_domains/1.2.2#/components/parameters/loginParam
      - $ref: https://api.swaggerhub.com/domains/Vantaca/standard_domains/1.2.2#/components/parameters/pwdParam
      - name: assocCode
        in: query
        description: unique identifer for an association
        schema:
          type: string
      - name: invoiceDateStart
        in: query
        description: if no start date is specified, field will default to 30 days ago. if start date is provided without an end date, response will return data for the date range between the specified start date and the today's date.</br> ***format must be MM-DD-YYY***
        schema:
          type: string
          format: date
      - name: invoiceDateEnd
        in: query
        description: if no end date is specified, field will default to today's date. if end date is provided without a start date, response will return data from 30 days prior to the specifie end date.</br> ***format must be MM-DD-YYY***
        schema:
          type: string
          format: date
      responses:
        '200':
          description: OK Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/listInvoices'
        '204':
          description: no content - call was successful, but no data for given parameters
