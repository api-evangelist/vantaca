          description: internal error - internal processing error, please contact support if issue persists
  /AP/glTransactionHistory:
    get:
      tags:
      - ap
      summary: retrieves an association's accounts receivable/income aggregate data by GL Code…
      operationId: getTransactionHistory
      parameters:
      - $ref: https://api.swaggerhub.com/domains/Vantaca/standard_domains/1.2.2#/components/parameters/companyParam
      - $ref: https://api.swaggerhub.com/domains/Vantaca/standard_domains/1.2.2#/components/parameters/loginParam
      - $ref: https://api.swaggerhub.com/domains/Vantaca/standard_domains/1.2.2#/components/parameters/pwdParam
      - in: query
        name: assocCode
        required: true
        description: unique identifer for an association
        schema:
          type: string
      - in: query
        name: startDate
        description: beginning date range. *if no startDate is specified, parameter will default to first day of the previous month.*
        schema:
          type: string
      - in: query
        name: endDate
        description: ending date range. *if no endDate is specified, parameter will default to last day of the previous month.
        schema:
          type: string
      - in: query
        name: glType
        description: general ledger account type. </br> *field will default to **Income***
        schema:
          type: string
          enum:
          - Income
          - Expense
          - Asset
          - Equity
          - Liability
      responses:
        '200':
          description: OK Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/glTransactionHistory'
        '204':
          description: no content - call was successful, but no data for given parameters
        '403':
          description: forbidden - authentication failed
        '404':
          description: not found
        '500':
          description: internal error - internal processing error, please contact support if issue persists
components:
  schemas:
    getProviderList:
      type: object
      properties:
        providerID:
          type: integer
          description: unique identifier for the service provider
          example: 5
        name:
          type: string
          description: service provider name
          example: Jacky Stewart's Mailbox Repair
        address:
          type: string
          description: service provider street number and street name
          example: 812 Lime Rock Ave.
        unit:
          type: string
          description: service provider unit number
        city:
          type: string
          description: service provider city
          example: Lakeville
        state:
          type: string
          description: service provider state
          example: CT
        zip:
          type: string
          description: service provider zip
          example: 12345
        email:
          type: string
          description: primary email
          example: jlewin@mailboxes.com
        phone:
          type: string
          description: primary phone
          example: (000) 000-5555
        fax:
          type: string
          description: primary fax
        payMethod:
          type: string
          description: 'payment method, possible values: Check, ACH, Credit Card, Auto Draft'
        lastModified:
          type: string
          format: date-time
          description: date provider was last modified
          example: '2019-08-16T13:16:41.847'
        dba:
          type: string
          description: service provider DBA
          example: Jacky Stewart
        taxID:
          type: string
          description: provider tax id
          example: 98-7654321
        send1099:
          type: boolean
          description: if **true**, service provider sends 1099s, else **false**
          example: true
        contactName:
          type: string
          description: contact name for the service provider
          example: Jane Stewart
        bankAccountNumber:
          type: string
          description: service provider bank account number
          example: 102034040506
        aba:
          type: string
          description: service provider ABA number
          example: 511364
        holdPayment:
          type: boolean
          description: if true, provider is on hold, else, false
          example: true
        holdReason:
          type: string
          description: reason provider is on hold. *255 character limit*
          example: Payment Due
        apiProviderInsurance:
          type: array
          description: list of insurance policies for provider
          items:
            $ref: '#/components/schemas/apiProviderInsurance'
    listInvoices:
      type: object
      properties:
