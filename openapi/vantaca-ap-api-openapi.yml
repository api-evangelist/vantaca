          description: base 64 encoded string of invoice image
          example: ADFASBNADFGASDDRDFASDFER1232ASF2
        inActive:
          type: string
          format: date-time
          description: timestamp when invoice was deleted
        referenceNumber:
          type: string
          description: invoice reference number
          example: 4141414
        payType:
          type: string
          description: type of payment
        details:
          type: array
          description: list of GL items for invoice
          items:
            $ref: '#/components/schemas/invoiceDetail'
    payInvoices:
      type: object
      properties:
        paymentID:
          type: integer
          description: unique identifier for payment
          example: 86753098
    getProviderList:
      type: object
      properties:
        providerID:
          type: integer
          description: unique identifier for the service provider
          example: 5
        name:
          type: string
          description: service provider name
          example: Jacky Stewart's Mailbox Repair
        address:
          type: string
          description: service provider street number and street name
          example: 812 Lime Rock Ave.
        unit:
          type: string
          description: service provider unit number
        city:
          type: string
          description: service provider city
          example: Lakeville
        state:
          type: string
          description: service provider state
          example: CT
        zip:
          type: string
          description: service provider zip
          example: 12345
        email:
          type: string
          description: primary email
          example: jlewin@mailboxes.com
        phone:
          type: string
          description: primary phone
          example: (000) 000-5555
        fax:
          type: string
          description: primary fax
        payMethod:
          type: string
          description: 'payment method, possible values: Check, ACH, Credit Card, Auto Draft'
        lastModified:
          type: string
          format: date-time
          description: date provider was last modified
          example: '2019-08-16T13:16:41.847'
        dba:
          type: string
          description: service provider DBA
          example: Jacky Stewart
        taxID:
          type: string
          description: provider tax id
          example: 98-7654321
        send1099:
          type: boolean
          description: if **true**, service provider sends 1099s, else **false**
          example: true
        contactName:
          type: string
          description: contact name for the service provider
          example: Jane Stewart
        bankAccountNumber:
          type: string
          description: service provider bank account number
          example: 102034040506
        aba:
          type: string
          description: service provider ABA number
          example: 511364
        holdPayment:
          type: boolean
          description: if true, provider is on hold, else, false
          example: true
        holdReason:
          type: string
          description: reason provider is on hold. *255 character limit*
          example: Payment Due
        apiProviderInsurance:
          type: array
          description: list of insurance policies for provider
          items:
            $ref: '#/components/schemas/apiProviderInsurance'
    getPayments:
      type: object
      properties:
        paymentID:
          type: integer
          description: unique identifier returned from payInvoice
          example: 1191
        invoiceIDs:
          type: array
          description: list of invoice IDs
          items:
            type: integer
            example: 76891, 98712, 21314
        checkNo:
          type: string
          description: check number
          example: 999123213645345
        payType:
          type: string
          description: type of payment
