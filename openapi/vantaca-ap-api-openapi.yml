openapi: 3.2.0
info:
  description: The Vantaca API is a JSON based web service.
  version: 3.8.0
  title: Vantaca's Standard /AP/ API
  contact:
    email: vendorsupport@vantaca.com
servers:
- description: SwaggerHub API Auto Mocking
  url: https://virtserver.swaggerhub.com/Vantaca/vantacaStandard/3.8.0
tags:
- name: ap
  description: 'These methods are specific to AP or Invoice related functions and can only be accessed by designated AP credentials. Note: Entering invalid dates may result in them appearing as null or blank in Vantaca

    All AP calls will use the same URL path: /AP/{***method***}'
paths:
  /AP/associationList:
    get:
      tags:
      - ap
      summary: retrieves a list of live associations
      operationId: getAssociationList
      parameters:
      - $ref: https://api.swaggerhub.com/domains/Vantaca/standard_domains/1.2.2#/components/parameters/companyParam
      - $ref: https://api.swaggerhub.com/domains/Vantaca/standard_domains/1.2.2#/components/parameters/loginParam
      - $ref: https://api.swaggerhub.com/domains/Vantaca/standard_domains/1.2.2#/components/parameters/pwdParam
      responses:
        '200':
          description: OK Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/getAssociationList'
        '204':
          description: no content - call was successful, but no data for given parameters
        '403':
          description: forbidden - authentication failed
        '404':
          description: not found
        '500':
          description: internal error - internal processing error, please contact support if issue persists
  /AP/providerList:
    get:
      tags:
      - ap
      summary: retrieves a list of all service providers for the company
      operationId: getProviderList
      parameters:
      - $ref: https://api.swaggerhub.com/domains/Vantaca/standard_domains/1.2.2#/components/parameters/companyParam
      - $ref: https://api.swaggerhub.com/domains/Vantaca/standard_domains/1.2.2#/components/parameters/loginParam
      - $ref: https://api.swaggerhub.com/domains/Vantaca/standard_domains/1.2.2#/components/parameters/pwdParam
      - in: query
        name: providerID
        description: unique identifier for provider
        schema:
          type: integer
      - in: query
        name: includeInsurance
        description: if **true**, resopnse will include providerInsurance array, else **false**, and providerInsurance field will display as null
        schema:
          type: boolean
      responses:
        '200':
          description: OK Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/getProviderList'
        '204':
          description: no content - call was successful, but no data for given parameters
        '403':
          description: forbidden - authentication failed
        '404':
          description: not found
        '500':
          description: internal error - internal processing error, please contact support if issue persists
  /AP/glList:
    get:
      tags:
      - ap
      summary: retrieves a list of all GL Codes for the company or association
      operationId: getGLList
      parameters:
      - $ref: https://api.swaggerhub.com/domains/Vantaca/standard_domains/1.2.2#/components/parameters/companyParam
      - $ref: https://api.swaggerhub.com/domains/Vantaca/standard_domains/1.2.2#/components/parameters/loginParam
      - $ref: https://api.swaggerhub.com/domains/Vantaca/standard_domains/1.2.2#/components/parameters/pwdParam
      - in: query
        name: assocCode
        description: unique identifer for an association
        schema:
          type: string
      responses:
        '200':
          description: OK Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/getGLList'
        '204':
          description: no content - call was successful, but no data for given parameters
        '403':
          description: forbidden - authentication failed
        '404':
          description: not found
        '500':
          description: internal error - internal processing error, please contact support if issue persists
  /AP/fundList:
    get:
      tags:
      - ap
      summary: retrieves a list of all funds for the company or association
      operationId: getFundList
      parameters:
      - $ref: https://api.swaggerhub.com/domains/Vantaca/standard_domains/1.2.2#/components/parameters/companyParam
      - $ref: https://api.swaggerhub.com/domains/Vantaca/standard_domains/1.2.2#/components/parameters/loginParam
      - $ref: https://api.swaggerhub.com/domains/Vantaca/standard_domains/1.2.2#/components/parameters/pwdParam
      - in: query
        name: assocCode
        description: unique identifer for an association
        schema:
          type: string
      responses:
        '200':
          description: OK Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/getFundList'
        '204':
          description: no content - call was successful, but no data for given parameters
        '403':
          description: forbidden - authentication failed
        '404':
          description: not found
        '500':
          description: internal error - internal processing error, please contact support if issue persists
  /AP/bankAccountList:
    get:
      tags:
      - ap
      summary: retrieves a list of all bank accounts for the company or association
      operationId: getBankAccountList
      parameters:
      - $ref: https://api.swaggerhub.com/domains/Vantaca/standard_domains/1.2.2#/components/parameters/companyParam
      - $ref: https://api.swaggerhub.com/domains/Vantaca/standard_domains/1.2.2#/components/parameters/loginParam
      - $ref: https://api.swaggerhub.com/domains/Vantaca/standard_domains/1.2.2#/components/parameters/pwdParam
      - in: query
        name: assocCode
        description: unique identifer for an association
        schema:
          type: string
      - in: query
        name: allAccountTypes
        description: if **true** response will include CD and Eskrow bank account types, else **false** or null and response will exclude CD and Eskrow accounts by default </br> *both accounts are excluded by default unless allAccountTypes is passed as true*
        schema:
          type: boolean
      responses:
        '200':
          description: OK Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/getBankAccountList'
        '204':
          description: no content - call was successful, but no data for given parameters
        '403':
          description: forbidden - authentication failed
        '404':
          description: not found
        '500':
          description: internal error - internal processing error, please contact support if issue persists
  /AP/bankAccountBalance:
    get:
      tags:
      - ap
      summary: retrieves a balance list for one or more bank accounts
      operationId: getBankAccountBalance
      parameters:
      - $ref: https://api.swaggerhub.com/domains/Vantaca/standard_domains/1.2.2#/components/parameters/companyParam
      - $ref: https://api.swaggerhub.com/domains/Vantaca/standard_domains/1.2.2#/components/parameters/loginParam
      - $ref: https://api.swaggerhub.com/domains/Vantaca/standard_domains/1.2.2#/components/parameters/pwdParam
      - in: query
        name: assocCode
        description: unique identifer for an association
        schema:
          type: string
      - in: query
        name: bankAccountID
        description: unique identifier for the bank account
        schema:
          type: integer
      - in: query
        name: allAccountTypes
        description: if **true** response will include CD and Eskrow bank account types, else **false** or null and response will exclude CD and Eskrow accounts by default </br> *both accounts are excluded by default unless allAccountTypes is passed as true*
        schema:
          type: boolean
      responses:
        '200':
          description: OK Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/getBankAccountBalance'
        '204':
          description: no content - call was successful, but no data for given parameters
        '403':
          description: forbidden - authentication failed
        '404':
          description: not found
        '500':
          description: internal error - internal processing error, please contact support if issue persists
  /AP/createInvoice:
    post:
      tags:
      - ap
      summary: creates a new invoice
      operationId: createInvoice
      parameters:
      - $ref: https://api.swaggerhub.com/domains/Vantaca/standard_domains/1.2.2#/components/parameters/companyParam
      - $ref: https://api.swaggerhub.com/domains/Vantaca/standard_domains/1.2.2#/components/parameters/loginParam
      - $ref: https://api.swaggerhub.com/domains/Vantaca/standard_domains/1.2.2#/components/parameters/pwdParam
      - in: query
        name: assocCode
        description: unique identifer for an association
        required: true
        schema:
          type: string
      - in: query
        name: providerID
        required: true
        description: unique identifier for the service provider
        schema:
          type: integer
      - in: query
        name: invoiceID
        description: unique identifier for the invoice created by /AP/createInvoice
        schema:
          type: integer
      - in: query
        name: isExpensed
        description: if **true**, invoice has been approved and should be expensed in GL
        schema:
          type: boolean
      - in: query
        name: accountNo
        description: account number from invoice
        schema:
          type: string
      - in: query
        name: invoiceNo
        description: invoice number
        schema:
          type: string
      - in: query
        name: invoiceDate
        description: invoice date
        schema:
          type: string
          format: date-time
      - in: query
        name: dueDate
        description: date the invoice is due
        schema:
          type: string
          format: date-time
      - in: query
        name: total
        description: invoice total amount
        required: true
        schema:
          type: integer
          format: decimal
      - in: query
        name: file
        description: base 64 encoded string of invoice image
        required: true
        schema:
          type: string
      - in: query
        name: fileName
        description: name of file attachment
        required: true
        schema:
          type: string
      - in: query
        name: referenceNumber
        description: invoice reference number
        schema:
          type: string
      - in: query
        name: payType
        description: pay type for the invoice
        schema:
          type: string
          format: date-time
      requestBody:
        description: invoiceDetails
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                invoiceDetailID:
                  type: string
                  description: unique identifier for the invoice detail
                  example: 1
                glAccountID:
                  type: string
                  description: unique identifier for the GL account
                  example: 5
                fundID:
                  type: string
                  description: unique identifier for the fund
                  example: 10
                description:
                  type: string
                  description: invoice detail description
                  example: expired
                debitCredit:
                  type: string
                  description: d = debit, c = credit
                  example: c
                amount:
                  type: integer
                  format: decimal
                  description: invoice amount
                  example: 55.55
              required:
              - glAccountID
              - fundID
              - amount
      responses:
        '200':
          description: OK Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/payInvoices'
        '204':
          description: no content - call was successful, but no data for given parameters
        '400':
          description: bad request - required parameters are missing or invalid
        '403':
          description: forbidden - authentication failed
        '404':
          description: not found
        '500':
          description: internal error - internal processing error, please contact support if issue persists
  /AP/payInvoices:
    post:
      tags:
      - ap
      summary: marks one or more existing invoices in Vantaca as paid
      description: InvoiceID must be expensed to pay
      operationId: postPayInvoices
      parameters:
      - $ref: https://api.swaggerhub.com/domains/Vantaca/standard_domains/1.2.2#/components/parameters/companyParam
      - $ref: https://api.swaggerhub.com/domains/Vantaca/standard_domains/1.2.2#/components/parameters/loginParam
      - $ref: https://api.swaggerhub.com/domains/Vantaca/standard_domains/1.2.2#/components/parameters/pwdParam
      - in: query
        name: checkNo
        description: check number
        schema:
          type: string
      - in: query
        name: payType
        description: invoice payment type
        schema:
          type: string
          enum:
          - ACH
          - Check
          - VCC
          - Draft
      - in: query
        name: payDate
        description: date the invoice was paid
        required: true
        schema:
          type: string
          format: date-time
      - in: query
        name: bankAccountID
        description: unique identifier for the bank account
        required: true
        schema:
          type: integer
      - in: query
        name: reference number
        description: invoice reference number
        schema:
          type: string
      requestBody:
        description: array of invoiceIDs
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/invoiceIDs'
              example:
              - '654324'
              - '123345'
              - '453345'
      responses:
        '200':
          description: OK Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/payInvoices'
        '204':
          description: no content - call was successful, but no data for given parameters
        '400':
          description: bad request - required parameters are missing or invalid
        '403':
          description: forbidden - authentication failed
        '404':
          description: not found
        '500':
          description: internal error - internal processing error, please contact support if issue persists
  /AP/updateInvoice:
    post:
      tags:
      - ap
      summary: updates an existing invoice
      description: All fields must be passed in update, excluding file and fileName, which can be used optionally to upload a new file attachment. All other fields will be used to update the invoice data for every call. Any fields not sent will updated to their default empty values.
      operationId: updateInvoice
      parameters:
      - $ref: https://api.swaggerhub.com/domains/Vantaca/standard_domains/1.2.2#/components/parameters/companyParam
      - $ref: https://api.swaggerhub.com/domains/Vantaca/standard_domains/1.2.2#/components/parameters/loginParam
      - $ref: https://api.swaggerhub.com/domains/Vantaca/standard_domains/1.2.2#/components/parameters/pwdParam
      - in: query
        name: assocCode
        description: unique identifer for an association
        required: true
        schema:
          type: string
      - in: query
        name: providerID
        description: unique identifier for the service provider
        schema:
          type: integer
      - in: query
        name: invoiceID
        required: true
        description: invoice action item number
        schema:
          type: integer
      - in: query
        name: isExpensed
        description: if **true**, invoice has been approved and should be expensed in GL
        schema:
          type: boolean
      - in: query
        name: accountNo
        description: account number from invoice
        schema:
          type: string
      - in: query
        name: invoiceNo
        description: invoice number
        schema:
          type: integer
      - in: query
        name: invoiceDate
        description: invoice date
        schema:
          type: string
          format: date-time
      - in: query
        name: dueDate
        description: date the invoice is due
        schema:
          type: string
          format: date-time
      - in: query
        name: total
        description: invoice total amount
        required: true
        schema:
          type: integer
          format: date-time
      - in: query
        name: file
        description: name of file attachment
        required: true
        schema:
          type: string
      - in: query
        name: fileName
        description: base 64 encoded string of invoice image
        required: true
        schema:
          type: string
      requestBody:
        description: array of invoice details
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                invoiceDetailID:
                  type: string
                  description: unique identifier for the invoice detail
                  example: 1
                glAccountID:
                  type: string
                  description: unique identifier for the GL account
                  example: 5
                fundID:
                  type: string
                  description: unique identifier for the fund
                  example: 10
                description:
                  type: string
                  description: invoice detail description
                  example: expired
                debitCredit:
                  type: string
                  description: d = debit, c = credit
                  example: c
                amount:
                  type: integer
                  format: decimal
                  description: invoice amount
                  example: 55.55
              required:
              - glAccountID
              - fundID
              - amount
      responses:
        '200':
          description: OK Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responseSuccess'
        '204':
          description: no content - call was successful, but no data for given parameters
        '400':
          description: bad request - required parameters are missing or invalid
        '403':
          description: forbidden - authentication failed
        '404':
          description: not found
        '500':
          description: internal error - internal processing error, please contact support if issue persists
  /AP/voidInvoices:
    post:
      tags:
      - ap
      summary: voids the payment and optionally the whole invoice
      operationId: voidInvoice
      parameters:
      - $ref: https://api.swaggerhub.com/domains/Vantaca/standard_domains/1.2.2#/components/parameters/companyParam
      - $ref: https://api.swaggerhub.com/domains/Vantaca/standard_domains/1.2.2#/components/parameters/loginParam
      - $ref: https://api.swaggerhub.com/domains/Vantaca/standard_domains/1.2.2#/components/parameters/pwdParam
      - in: query
        name: voidDate
        description: The date the invoice should be voided as
        required: true
        schema:
          type: string
          format: date-time
      - in: query
        name: comment
        required: true
        description: Description of why the payment/invoice is being voided
        schema:
          type: string
      - in: query
        name: paymentOnly
        description: if **true**, only payment will be voided, else **false**, entire invoice will be voided
        required: true
        schema:
          type: boolean
      requestBody:
        description: array of invoiceIDs
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/invoiceIDs'
              example:
              - '654324'
              - '123345'
              - '453345'
            examples:
              Example 1:
                value:
                  invoiceIDs:
                  - '654324'
                  - '123345'
                  - '453345'
      responses:
        '200':
          description: OK Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responseSuccess'
        '204':
          description: no content - call was successful, but no data for given parameters
        '400':
          description: bad request - required parameters are missing or invalid
        '403':
          description: forbidden - authentication failed
        '404':
          description: not found
        '500':
          description: internal error - internal processing error, please contact support if issue persists
  /AP/approveInvoice:
    post:
      tags:
      - ap
      summary: approves or declines the invoice
      operationId: approveInvoice
      parameters:
      - $ref: https://api.swaggerhub.com/domains/Vantaca/standard_domains/1.2.2#/components/parameters/companyParam
      - $ref: https://api.swaggerhub.com/domains/Vantaca/standard_domains/1.2.2#/components/parameters/loginParam
      - $ref: https://api.swaggerhub.com/domains/Vantaca/standard_domains/1.2.2#/components/parameters/pwdParam
      - in: query
        name: invoiceID
        description: invoice action item number
        required: true
        schema:
          type: integer
      - in: query
        name: userID
        required: true
        description: user ID of the user approving
        schema:
          type: integer
      - in: query
        name: note
        description: any comments related to the invoice being approved/declined
        required: true
        schema:
          type: string
      - in: query
        name: status
        required: true
        description: 1 = approved, 2 = declined
        schema:
          type: string
      - in: query
        name: assocCode
        description: unqiue identifier for the association
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responseSuccess'
        '204':
          description: no content - call was successful, but no data for given parameters
        '400':
          description: bad request - required parameters are missing or invalid
        '403':
          description: forbidden - authentication failed
        '404':
          description: not found
        '500':
          description: internal error - internal processing error, please contact support if issue persists
  /AP/deleteInvoice:
    post:
      tags:
      - ap
      summary: deletes the invoice and all associated payments
      operationId: deleteInvoice
      parameters:
      - $ref: https://api.swaggerhub.com/domains/Vantaca/standard_domains/1.2.2#/components/parameters/companyParam
      - $ref: https://api.swaggerhub.com/domains/Vantaca/standard_domains/1.2.2#/components/parameters/loginParam
      - $ref: https://api.swaggerhub.com/domains/Vantaca/standard_domains/1.2.2#/components/parameters/pwdParam
      - in: query
        name: invoiceID
        description: invoice action item number
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: OK Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responseSuccess'
        '204':
          description: no content - call was successful, but no data for given parameters
        '400':
          description: bad request - required parameters are missing or invalid
        '403':
          description: forbidden - authentication failed
        '404':
          description: not found
        '500':
          description: internal error - internal processing error, please contact support if issue persists
  /AP/listBoardInvoices:
    get:
      tags:
      - ap
      summary: returns a list of invoices that the current user can approve/decline based on…
      description: Only invoices waiting to be approved by the user will be returned. User needs to have the required board approval rights.
      operationId: listBoardInvoice
      parameters:
      - $ref: https://api.swaggerhub.com/domains/Vantaca/standard_domains/1.2.2#/components/parameters/companyParam
      - $ref: https://api.swaggerhub.com/domains/Vantaca/standard_domains/1.2.2#/components/parameters/loginParam
      - $ref: https://api.swaggerhub.com/domains/Vantaca/standard_domains/1.2.2#/components/parameters/pwdParam
      - in: query
        name: ownerAccount
        description: unique identifier for the owner account for the list of returned invoices
        required: true
        schema:
          type: string
      - in: query
        name: assocCode
        description: unique identifer for an association
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/getBoardInvoiceList'
        '204':
          description: no content - call was successful, but no data for given parameters
        '400':
          description: bad request - required parameters are missing or invalid
        '403':
          description: forbidden - authentication failed
        '404':
          description: not found
        '500':
          description: internal error - internal processing error, please contact support if issue persists
  /AP/getBoardInvoice:
    get:
      tags:
      - ap
      summary: returns a single invoice that the user can approve/decline based on board…
      description: Only invoices waiting to be approved by the user will be returned. User needs to have the required board approval rights.
      operationId: getBoardInvoice
      parameters:
      - $ref: https://api.swaggerhub.com/domains/Vantaca/standard_domains/1.2.2#/components/parameters/companyParam
      - $ref: https://api.swaggerhub.com/domains/Vantaca/standard_domains/1.2.2#/components/parameters/loginParam
      - $ref: https://api.swaggerhub.com/domains/Vantaca/standard_domains/1.2.2#/components/parameters/pwdParam
      - in: query
        name: ownerAccount
        description: unique identifier for the owner account for the list of returned invoices
        required: true
        schema:
          type: string
      - in: query
        name: assocCode
        description: unique identifer for an association
        required: true
        schema:
          type: string
      - in: query
        name: invoiceID
        description: invoice action item number
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: OK Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/getBoardInvoice'
        '204':
          description: no content - call was successful, but no data for given parameters
        '400':
          description: bad request - required parameters are missing or invalid
        '403':
          description: forbidden - authentication failed
        '404':
          description: not found
        '500':
          description: internal error - internal processing error, please contact support if issue persists
  /AP/listInvoices:
    get:
      tags:
      - ap
      summary: returns a list of invoices created by createInvoice
      operationId: listInvoices
      parameters:
      - $ref: https://api.swaggerhub.com/domains/Vantaca/standard_domains/1.2.2#/components/parameters/companyParam
      - $ref: https://api.swaggerhub.com/domains/Vantaca/standard_domains/1.2.2#/components/parameters/loginParam
      - $ref: https://api.swaggerhub.com/domains/Vantaca/standard_domains/1.2.2#/components/parameters/pwdParam
      responses:
        '200':
          description: OK Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/listInvoices'
        '204':
          description: no content - call was successful, but no data for given parameters
        '400':
          description: bad request - required parameters are missing or invalid
        '403':
          description: forbidden - authentication failed
        '404':
          description: not found
