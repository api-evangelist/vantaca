components:
  schemas:
    getBankAccountBalance:
      type: object
      properties:
        bankAccountID:
          type: integer
          description: unique identifier for the bank account
          example: 86753098
        balance:
          type: integer
          format: decimal
          description: current balance
          example: 123,456,789.25
    getBankAccountList:
      type: object
      properties:
        assocCode:
          type: string
          description: unique identifer for an association
          example: 123
        bankAccountID:
          type: integer
          description: unique identifier for the bank account
          example: 123654
        description:
          type: string
          description: bank account description
          example: Gorgc's Savings
        glAccountID:
          type: string
          description: unique identifier for the GL account
          example: 12
        aba:
          type: string
          description: bank account routing number
          example: 12332
        accountNumber:
          type: string
          description: bank account number
          example: 867530990909
        balance:
          type: integer
          format: decimal
          description: bank account description
          example: 77,777.77
        accountType:
          type: string
          description: bank account type
          example: Savings
        contactName:
          type: string
          description: contact name for bank account
          example: Brad Pitt
