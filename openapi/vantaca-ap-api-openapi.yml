        providerID:
          type: integer
          description: unique identifer for the service provider
          example: 678
        isExpensed:
          type: boolean
          description: if **true** invoice has been approved and expensed in GL, else, **false**
        accountNo:
          type: string
          description: account number from invoice
          example: 2255880012
        invoiceNo:
          type: string
          description: invoice number from invoice
        invoiceDate:
          type: string
          format: date-time
          description: date invoice was created
          example: '{2022-02-11T00:00:00}'
        dueDate:
          type: string
          format: date-time
          description: invoice due date
          example: '{2022-02-11T00:00:00}'
        total:
          type: integer
          format: decimal
          description: invoice total amount
          example: 777.77
        fileName:
          type: string
          description: invoice attachment file name
          example: invoice.pdf
        file:
          type: string
          description: base 64 encoded string of invoice image
          example: ADFASBNADFGASDDRDFASDFER1232ASF2
        inActive:
          type: string
          format: date-time
